[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-canonical"
version = "0.1.0"
description = "Canonical graph-oriented extraction for Eldo and ngspice netlists."
requires-python = ">=3.10"

[project.scripts]
spice-canonical = "spice_canonical.canonical_netlist:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
