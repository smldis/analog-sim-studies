site_name: Analog Sim Studies
site_description: Prototype sidecar edit pipeline for text-first simulation studies.

theme:
  name: readthedocs

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - API Reference: api/edit.md
  - Design:
      - Manifesto: design/manifesto.md
      - Traced Edit API: design/traced-edit-api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
  - toc:
      permalink: true
