[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ass-run"
version = "0.1.0"
description = "Walk a validated Plan and execute its invocations in dependency order."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ass-exec"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../ass-exec/src"]
testpaths = ["tests"]
