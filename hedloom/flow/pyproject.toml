[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hedloom-flow"
version = "0.1.0"
description = "Executor-neutral static operation and flow planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dask = ["dask==2026.7.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
