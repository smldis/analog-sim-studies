[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hedloom"
version = "0.1.0"
description = "Author a study, plan it, and run it, in one place."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hedloom-flow", "hedloom-exec", "hedloom-run"]

[project.optional-dependencies]
dask = ["distributed==2026.7.1"]

[tool.uv.workspace]
members = ["flow", "exec", "run"]

[tool.uv.sources]
hedloom-flow = { workspace = true }
hedloom-exec = { workspace = true }
hedloom-run  = { workspace = true }

[dependency-groups]
dev = ["hedloom-flow[dask]", "pytest", "setuptools>=69"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
