[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidecar-edits"
version = "0.1.0"
description = "Typed, text-first sidecar edits for simulation directories."
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
    "pandas",
]

[project.scripts]
sidecar-render = "sidecar_edits.render:main"

[project.optional-dependencies]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-autodoc-typehints",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sidecar_edits = ["bin/*", "native/*.c"]

[tool.pytest.ini_options]
