[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ass-study-flow"
version = "0.2.0"
description = "A generic Dask and Jobqueue execution experiment for Analog Sim Studies."
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43",
    "dask[distributed]>=2025.1",
    "dask-jobqueue>=0.9",
]

[project.scripts]
ass-flow-demo = "ass_study_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
